name: Aurat narration regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .aurat
      - run: npm test --prefix .aurat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-aurat-report
          path: .aurat/report.json
          include-hidden-files: true
